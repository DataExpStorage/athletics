name: Send newsletter to Telegram

# Runs when a newsletter is pushed. The push may come from the weekly research agent,
# so this job treats everything in the push as untrusted:
#   1. the push may only touch the researched files (allowlist below);
#   2. the researched files must pass scripts/validate.py;
#   3. the script that receives the Telegram token must be byte-for-byte the reviewed
#      version (checksum below).
# After a deliberate change to scripts/send_telegram.py, update SEND_SCRIPT_SHA256 with
#   git show HEAD:scripts/send_telegram.py | sha256sum

on:
  push:
    branches: [main]
    paths: ["newsletters/*.md"]

permissions:
  contents: read

env:
  SEND_SCRIPT_SHA256: "7552a98fbb68b599e544194218f10a480bc72d0c5a48f8c03cf338d0cd57a994"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check what the push changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=$(git rev-parse HEAD~1); fi
          echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"
          allowed='^(newsletters/[0-9]{4}-W[0-9]{2}\.md|data/(entries|reports|team)/[0-9]+\.json|data/news/[0-9]{4}-W[0-9]{2}\.json|config/(agencies|prize_money)\.json|pipeline/runs/[0-9]{4}-W[0-9]{2}/[a-z-]+\.json)$'
          other=$(git diff --name-only "$BEFORE" HEAD | grep -Ev "$allowed" || true)
          if [ -n "$other" ]; then
            echo "This push also changed files outside the researched data, so nothing is sent:"
            echo "$other"
            echo "Push newsletters separately from code changes, or send by hand."
            exit 1
          fi
      - name: Validate researched files
        run: python -I scripts/validate.py
      - name: Check the sending script is the reviewed version
        run: echo "$SEND_SCRIPT_SHA256  scripts/send_telegram.py" | sha256sum -c -
      - name: Send newly added newsletters
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          git diff -z --name-only --diff-filter=A "$BEFORE" HEAD -- 'newsletters/*.md' \
            | xargs -0 -r python -I scripts/send_telegram.py
